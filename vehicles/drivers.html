<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Drivers Page Moved</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Arial, Helvetica, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            display: grid;
            min-height: 100vh;
            min-height: 100svh;
            margin: 0;
            padding: 1.5rem;
            place-items: center;
            color: #212529;
            background: #f1f3f5;
        }

        main {
            width: min(100%, 32rem);
            padding: 2.5rem;
            text-align: center;
            background: #dee2e6;
            border: 1px solid #adb5bd;
            border-radius: 0.75rem;
            box-shadow: 0 0.75rem 2rem rgb(0 0 0 / 18%);
        }

        h1 {
            margin: 0 0 1rem;
            font-size: clamp(1.75rem, 5vw, 2.25rem);
        }

        p {
            margin: 0 0 1.5rem;
            font-size: 1.1rem;
            line-height: 1.6;
        }

        a {
            display: inline-block;
            padding: 0.75rem 1.25rem;
            color: #fff;
            font-weight: 700;
            text-decoration: none;
            background: #495057;
            border-radius: 0.4rem;
        }

        a:hover,
        a:focus-visible {
            background: #343a40;
        }

        a:focus-visible {
            outline: 3px solid #0d6efd;
            outline-offset: 3px;
        }
    </style>
</head>
<body>
    <main>
        <h1>This page has moved</h1>
        <p>The Drivers page can now be found on 134 On Scene.</p>
        <a href="https://134onscene.com/drivers/">Go to the Drivers page</a>
    </main>
</body>
</html>
